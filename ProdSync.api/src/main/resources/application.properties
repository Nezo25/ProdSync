spring.application.name=prodsync

# Database Configuration (MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3308/mydatabase?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:verysecret}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Security (JWT)
jwt.secret=${JWT_SECRET:minha_chave_secreta_super_segura_para_desenvolvimento}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Webhook Security
api.key.header=X-API-Key
api.key.value=${API_KEY:sua_api_key_secreta_aqui}

# Disable Spring Boot Docker Compose integration to avoid startup errors
spring.docker.compose.enabled=false
